name: gbsw-platform

# 로컬 개발:  docker compose up -d db      (DB만 띄우고 앱은 npm run dev)
# 전체 스택:  docker compose up -d --build

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-gbsw}
  # 기본값을 두지 않는다 — 예전엔 .env 없이 띄우면 저장소에 적힌 비밀번호로 DB가 열렸다.
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정해야 합니다}
  POSTGRES_DB: ${POSTGRES_DB:-gbsw}

services:
  db:
    # postgres:18 OCI index digest resolved 2026-08-19:
    #   docker buildx imagetools inspect postgres:18
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    container_name: gbsw-db
    restart: unless-stopped
    environment: *db-env
    ports:
      # 호스트 5433, 루프백만 — 0.0.0.0 바인딩이면 교내망 어디서나 접근됐다.
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18부터는 /var/lib/postgresql 하나만 마운트한다.
      # (하위에 메이저 버전별 디렉터리를 만들어 pg_upgrade --link를 가능하게 함)
      - gbsw-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gbsw} -d ${POSTGRES_DB:-gbsw}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # 마이그레이션 전용 1회성 작업.
  # 런타임 이미지에 Prisma CLI(수십 MB)를 넣지 않으려고 builder 스테이지를 재사용한다.
  # app은 이 작업이 성공적으로 끝난 뒤에만 뜬다.
  migrate:
    build:
      context: .
      target: builder
    container_name: gbsw-migrate
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gbsw}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정해야 합니다}@db:5432/${POSTGRES_DB:-gbsw}

  app:
    build:
      context: .
      target: runner
    container_name: gbsw-app
    restart: unless-stopped
    # M16 — 컨테이너를 뚫어도 얻을 게 적게 만든다.
    # db·migrate에는 같은 걸 하지 않는다: postgres 공식 이미지는 기동 시
    # CHOWN·SETUID·SETGID가 필요해서(볼륨 소유권 정리, 권한 낮추기)
    # cap_drop: [ALL]을 걸면 아예 못 뜬다. migrate는 1회성이라 표면이 짧다.
    # app은 standalone Next.js 서버(순수 Node 프로세스, 이미 비루트 nextjs로
    # 돈다)라 어떤 리눅스 capability도 필요 없다 — 직접 `docker compose up`으로
    # 떠서 로그인·API 헬스체크가 정상 동작하는 것까지 확인했다.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # 컨테이너 하나가 폭주해 호스트 전체를 굶기는 걸 막는다.
    #
    # **512m에서 1g로 올렸다 — 커뮤니티 첨부가 20MB까지 들어오기 때문이다.**
    # 업로드 한 건이 파일 크기의 서너 배를 잠깐 들고 있다(받은 바이트 →
    # multipart 파싱 → Buffer 복사). 20MB면 한 건에 60~80MB이고, 512m에서는
    # 서너 명이 동시에 올리면 Next 자체가 쓰는 200MB 남짓과 합쳐 넘친다.
    # 파일 상한(community.schema.ts의 MAX_ATTACHMENT_BYTES)을 다시 올릴 때
    # 이 값도 함께 본다.
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gbsw}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정해야 합니다}@db:5432/${POSTGRES_DB:-gbsw}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET를 .env에 설정해야 합니다}
      # 기본값(localhost)을 운영에서 빠뜨리면 세션 쿠키에 Secure가 안 붙는다 — 반드시 https:// 값을 넣게 한다.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL를 .env에 설정해야 합니다}
      # 명단 미리보기 토큰(HMAC) 서명 키. 전달 경로가 없으면 코드가 늘
      # BETTER_AUTH_SECRET으로 떨어져 분리 의도가 조용히 무효가 된다.
      # 비워 두면 그 fallback을 그대로 쓴다 — `${VAR:-}`는 변수를 빼는 게 아니라
      # **빈 문자열로 넘기므로**, 빈 값을 「주지 않은 것」으로 보는 쪽은
      # roster.preview-token.ts다. 그 판정을 되돌리면 여기가 다시 깨진다.
      ROSTER_IMPORT_PREVIEW_SECRET: ${ROSTER_IMPORT_PREVIEW_SECRET:-}
      # 현재 가입은 유효한 초대코드 뒤 즉시 확인 proof를 만들어 발송기를 호출하지
      # 않는다. 아래 값은 실제 SMS 인증을 다시 켤 때 쓸 설정이라 보존한다.
      SMS_KEY: ${SMS_KEY:-}
      SMS_USER_ID: ${SMS_USER_ID:-}
      SMS_SENDER: ${SMS_SENDER:-}
      # 여기서 true를 기본값으로 주지 않는다. 운영에 SMS_KEY는 넣고 이 값만 빠뜨리면
      # 알리고가 요청을 정상 접수(assertAligoSuccess 통과)하면서도 실제로는 아무것도
      # 보내지 않는, 가장 알아채기 힘든 조용한 실패가 생긴다. 비워서 코드의 기본값
      # (env.SMS_TEST_MODE === "true", 즉 안 주면 false=진짜 발송)을 그대로 따르게 한다 —
      # 빠뜨렸을 때 "조용히 성공한 척"이 아니라 "실제로 보내짐"이 되는 쪽이 더 안전하다.
      SMS_TEST_MODE: ${SMS_TEST_MODE:-}
      # 커뮤니티 첨부가 사는 곳. 아래 볼륨과 짝이다.
      UPLOAD_DIR: /app/uploads
    volumes:
      # 커뮤니티 첨부. **DB 덤프에 안 들어가므로 백업을 따로 떠야 한다**
      # (docs/deploy.md).
      - gbsw-uploads:/app/uploads
    ports:
      # 루프백만 — db와 같은 이유다. 0.0.0.0에 열면 교내망 어디서나 리버스
      # 프록시를 건너뛰고 평문 HTTP로 직접 붙을 수 있고, 그러면 세션 쿠키가
      # 그대로 흐르고 x-forwarded-for도 누구나 위조해 감사로그에 심을 수 있다.
      # 프록시(nginx/Caddy)를 같은 호스트에 두고 여기로 넘긴다.
      # 프록시가 다른 호스트에 있다면 이 줄을 그 호스트만 닿는 주소로 바꾼다.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gbsw-db-data:
  gbsw-uploads:
