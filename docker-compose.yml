name: gbsw-platform

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-gbsw}
  # 기본 비밀번호 없이 운영 비밀을 반드시 주입한다.
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정해야 합니다}
  POSTGRES_DB: ${POSTGRES_DB:-gbsw}

services:
  db:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    container_name: gbsw-db
    restart: unless-stopped
    environment: *db-env
    ports:
      # DB는 루프백에서만 접근한다.
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18의 버전별 데이터 경로를 포함하는 상위 디렉터리를 마운트한다.
      - gbsw-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gbsw} -d ${POSTGRES_DB:-gbsw}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # Prisma CLI가 있는 builder를 재사용하며 성공해야 앱이 시작된다.
  migrate:
    build:
      context: .
      target: builder
    container_name: gbsw-migrate
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # URL을 직접 조립하므로 POSTGRES_PASSWORD에 URL 예약 문자를 쓰지 않는다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-gbsw}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정해야 합니다}@db:5432/${POSTGRES_DB:-gbsw}

  app:
    build:
      context: .
      target: runner
    container_name: gbsw-app
    restart: unless-stopped
    # 비루트 앱에는 capability가 불필요하다. DB 기동에는 CHOWN/SETUID/SETGID가 필요하다.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # 20MB 첨부의 파싱·복사 여유. 업로드 상한을 바꾸면 함께 검토한다.
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # URL을 직접 조립하므로 POSTGRES_PASSWORD에 URL 예약 문자를 쓰지 않는다.
      DATABASE_URL: postgresql://${POSTGRES_USER:-gbsw}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정해야 합니다}@db:5432/${POSTGRES_DB:-gbsw}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET를 .env에 설정해야 합니다}
      # 운영 HTTPS 공개 주소를 지정해 Secure 세션 쿠키를 사용한다.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL를 .env에 설정해야 합니다}
      # 빈 문자열도 미설정으로 취급해 BETTER_AUTH_SECRET으로 대체한다.
      ROSTER_IMPORT_PREVIEW_SECRET: ${ROSTER_IMPORT_PREVIEW_SECRET:-}
      # 현재 가입은 즉시 확인 proof를 만든다. 실발송 재활성화를 위해 SMS 설정을 보존한다.
      SMS_KEY: ${SMS_KEY:-}
      SMS_USER_ID: ${SMS_USER_ID:-}
      SMS_SENDER: ${SMS_SENDER:-}
      # 비워 두면 코드 기본값 false(실발송)를 사용한다.
      SMS_TEST_MODE: ${SMS_TEST_MODE:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      # 첨부는 DB 덤프에 포함되지 않아 별도 백업한다.
      - gbsw-uploads:/app/uploads
    ports:
      # 같은 호스트의 프록시만 접근한다. 직접 HTTP 접근과 전달 헤더 위조를 막는다.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gbsw-db-data:
  gbsw-uploads:
