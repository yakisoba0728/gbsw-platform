name: gbsw-platform

# 로컬 개발:  docker compose up -d db      (DB만 띄우고 앱은 npm run dev)
# 전체 스택:  docker compose up -d --build

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-gbsw}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gbsw_dev_password}
  POSTGRES_DB: ${POSTGRES_DB:-gbsw}

services:
  db:
    image: postgres:18
    container_name: gbsw-db
    restart: unless-stopped
    environment: *db-env
    ports:
      # 호스트 5433 — 로컬에 이미 도는 Postgres(5432)와 겹치지 않게.
      - "5433:5432"
    volumes:
      # Postgres 18부터는 /var/lib/postgresql 하나만 마운트한다.
      # (하위에 메이저 버전별 디렉터리를 만들어 pg_upgrade --link를 가능하게 함)
      - gbsw-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gbsw} -d ${POSTGRES_DB:-gbsw}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # 마이그레이션 전용 1회성 작업.
  # 런타임 이미지에 Prisma CLI(수십 MB)를 넣지 않으려고 builder 스테이지를 재사용한다.
  # app은 이 작업이 성공적으로 끝난 뒤에만 뜬다.
  migrate:
    build:
      context: .
      target: builder
    container_name: gbsw-migrate
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gbsw}:${POSTGRES_PASSWORD:-gbsw_dev_password}@db:5432/${POSTGRES_DB:-gbsw}

  app:
    build:
      context: .
      target: runner
    container_name: gbsw-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gbsw}:${POSTGRES_PASSWORD:-gbsw_dev_password}@db:5432/${POSTGRES_DB:-gbsw}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET를 .env에 설정해야 합니다}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # 비우면(로컬 기본) 인증코드가 콘솔로 나간다 — 알리고 미설정 시의 의도된 동작.
      # 지금까지는 여기 안 넘겨서 compose로 띄우면 SMS_*를 .env에 채워도 문자가
      # 항상 콘솔로 나갔다.
      SMS_KEY: ${SMS_KEY:-}
      SMS_USER_ID: ${SMS_USER_ID:-}
      SMS_SENDER: ${SMS_SENDER:-}
      # 여기서 true를 기본값으로 주지 않는다. 운영에 SMS_KEY는 넣고 이 값만 빠뜨리면
      # 알리고가 요청을 정상 접수(assertAligoSuccess 통과)하면서도 실제로는 아무것도
      # 보내지 않는, 가장 알아채기 힘든 조용한 실패가 생긴다. 비워서 코드의 기본값
      # (env.SMS_TEST_MODE === "true", 즉 안 주면 false=진짜 발송)을 그대로 따르게 한다 —
      # 빠뜨렸을 때 "조용히 성공한 척"이 아니라 "실제로 보내짐"이 되는 쪽이 더 안전하다.
      SMS_TEST_MODE: ${SMS_TEST_MODE:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gbsw-db-data:
