name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Unit Verification
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://gbsw:gbsw@localhost:5432/gbsw_unit

    steps:
      # actions/checkout v4 tag resolved 2026-08-19:
      # git ls-remote https://github.com/actions/checkout.git refs/tags/v4
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4 tag resolved 2026-08-19:
      # git ls-remote https://github.com/actions/setup-node.git refs/tags/v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit verification
        run: npm run verify:unit

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # postgres:18 OCI index digest resolved 2026-08-19:
        # docker buildx imagetools inspect postgres:18
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: gbsw
          POSTGRES_PASSWORD: gbsw
          POSTGRES_DB: gbsw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gbsw -d gbsw_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gbsw:gbsw@localhost:5432/gbsw_test
      TEST_DATABASE_URL: postgresql://gbsw:gbsw@localhost:5432/gbsw_test

    steps:
      # actions/checkout v4 tag resolved 2026-08-19:
      # git ls-remote https://github.com/actions/checkout.git refs/tags/v4
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4 tag resolved 2026-08-19:
      # git ls-remote https://github.com/actions/setup-node.git refs/tags/v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare integration database
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npm run test:integration

  build:
    name: Production Build & Browser Smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        # postgres:18 OCI index digest resolved 2026-08-19:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_USER: gbsw
          POSTGRES_PASSWORD: gbsw
          POSTGRES_DB: gbsw_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gbsw -d gbsw_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_DATABASE_URL: postgresql://gbsw:gbsw@localhost:5432/gbsw_e2e
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      BETTER_AUTH_URL: http://127.0.0.1:3100

    steps:
      # actions/checkout v4 tag resolved 2026-08-19:
      # git ls-remote https://github.com/actions/checkout.git refs/tags/v4
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4 tag resolved 2026-08-19:
      # git ls-remote https://github.com/actions/setup-node.git refs/tags/v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Prepare browser test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}

      - name: Build Docker runner
        run: docker build --target runner --tag gbsw-platform:ci .

      - name: Run Docker runner smoke
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          BETTER_AUTH_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          container=gbsw-platform-ci
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              docker logs "$container" 2>&1 || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --network host \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env DATABASE_URL \
            --env BETTER_AUTH_SECRET \
            --env BETTER_AUTH_URL \
            --env UPLOAD_DIR=/app/uploads \
            gbsw-platform:ci

          response=""
          for attempt in $(seq 1 60); do
            if response=$(curl --silent --fail http://127.0.0.1:3000/api/health); then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null)" != "true" ]; then
              echo "Docker runner exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          test -n "$response"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload.ok !== true || payload.db !== "up") process.exit(1);
          ' "$response"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
